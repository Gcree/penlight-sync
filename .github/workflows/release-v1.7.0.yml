name: Release v1.7.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-v1.7.1]') }}
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run test suite
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Build universal macOS app
        run: ./build_mac_app.sh
      - name: Package macOS app and CLI
        shell: bash
        run: |
          mkdir -p dist/package
          cp -R dist/PenlightSync.app dist/package/
          swiftc -parse-as-library ScreenColor.swift PenlightProtocol.swift PenlightSync.swift -o dist/package/PenlightSync
          cp "開始連動.command" README.md README.en.md LICENSE NOTICE.md dist/package/
          (cd dist/package && zip -r ../PenlightSync-macOS.zip .)
      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/PenlightSync-macOS.zip
          if-no-files-found: error
          retention-days: 1

  build-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-v1.7.1]') }}
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run Windows core tests
        run: dotnet run --project windows/PenlightCore.Tests -c Release
      - name: Publish Windows x64 app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          dotnet publish windows/PenlightSyncWin -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist/windows
          Copy-Item README.md, README.en.md, LICENSE, NOTICE.md dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath dist/PenlightSync-Windows-x64.zip -Force
      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/PenlightSync-Windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-v1.7.1]') }}
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS asset
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets
      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.1
          target_commitish: ${{ github.sha }}
          name: 'v1.7.1：網站連動模式、音樂節拍與 BPM 自動燈光效果'
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 修復 / Fixed 
            --更換網址後導致的手燈連動失靈。
          files: |
            release-assets/PenlightSync-macOS.zip
            release-assets/PenlightSync-Windows-x64.zip
